# Gitrepo configuration. Every key is optional; the values shown are the
# defaults unless noted. GITREPO_LISTEN / GITREPO_PUBLIC_URL / GITREPO_DATA_DIR
# environment variables override the corresponding keys.
version: 1

listen: ":8080"
# The address clients push to; used for clone URLs printed by the API and gr.
public_url: "https://git.example.com"     # default: http://localhost:8080
data_dir: "/data"                          # default: ./data

# Environment variable holding the 32-byte master key that encrypts platform
# credentials (base64 or hex). Generate with `gitrepo keygen`. Losing it
# means re-entering all target credentials.
secret_key_env: GITREPO_SECRET_KEY
# secret_key_file: /run/secrets/gitrepo_key

# Environment variable holding the bootstrap admin token.
admin_token_env: GITREPO_ADMIN_TOKEN

# Reverse proxies (IPs or CIDRs) allowed to set X-Forwarded-For. Client
# addresses in the audit log come from that header only when the direct peer
# is listed here; otherwise the header is ignored.
trusted_proxies: []        # e.g. ["127.0.0.1", "10.0.0.0/8"]

git:
  binary: git          # git >= 2.31 is required
  # self_path: /usr/local/bin/gitrepo   # executable used by hooks/askpass; default: this binary

sync:
  workers: 4                 # concurrent remote operations, all repositories
  patrol_interval: 10m       # full re-check of every repository
  push_timeout: 10m          # per mirror: ls-remote + push + verify
  post_receive_wait: 30s     # how long `git push` waits for mirror results
  backup_retention: 30d      # refs/backup/* older than this are pruned
  retry_base: 30s            # backoff for failed mirrors: 30s, 1m, 2m, … up to retry_max
  retry_max: 1h

policy:
  # Hard cap per file. The effective limit for a repository is the smallest of
  # this and each mirror's limit (GitHub: 100 MiB). 0 = mirrors only.
  max_file_size: 0
  # Largest Git LFS object accepted by the hub. 0 = unlimited.
  max_lfs_object_size: 0

ssh:
  listen: ""                 # e.g. ":2222" enables git over SSH (off by default)
  public_host: ""            # host[:port] for ssh:// URLs; default: public_url host + listen port

bundles:
  enabled: false             # bundle-uri: pre-built bundles for clients with transfer.bundleURI=true
  interval: 24h              # minimum age before a bundle is rebuilt (only when refs changed)
  min_size: 50MiB            # repositories smaller than this get no bundle

alerts:
  failure_threshold: 3            # remote.failed after this many consecutive failures
  credential_expiry_warning: 14d  # credential.expiring when a target expires within this window

audit:
  retention: 365d            # audit log entries older than this are pruned; 0 = keep forever
