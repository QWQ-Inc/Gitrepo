# docker compose -f deploy/docker-compose.yml up -d
# Put repohub behind a TLS-terminating reverse proxy and set REPOHUB_PUBLIC_URL
# to the address clients use.
services:
  repohub:
    build: ..
    image: repohub:local
    restart: unless-stopped
    ports:
      - "8080:8080"
    environment:
      REPOHUB_SECRET_KEY: ${REPOHUB_SECRET_KEY:?generate one with `docker run --rm repohub:local keygen`}
      REPOHUB_ADMIN_TOKEN: ${REPOHUB_ADMIN_TOKEN:?set a long random admin token}
      REPOHUB_PUBLIC_URL: ${REPOHUB_PUBLIC_URL:-http://localhost:8080}
      # Optional: mount deploy/repohub.example.yaml and point at it.
      # REPOHUB_CONFIG: /etc/repohub/repohub.yaml
    volumes:
      - repohub-data:/data
      # - ./repohub.example.yaml:/etc/repohub/repohub.yaml:ro

volumes:
  repohub-data:
