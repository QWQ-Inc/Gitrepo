# docker compose -f deploy/docker-compose.yml up -d
# Put Gitrepo behind a TLS-terminating reverse proxy and set GITREPO_PUBLIC_URL
# to the address clients use.
services:
  gitrepo:
    build: ..
    image: gitrepo:local
    restart: unless-stopped
    ports:
      - "8080:8080"
      - "2222:2222"   # git over SSH
    environment:
      GITREPO_SECRET_KEY: ${GITREPO_SECRET_KEY:?generate one with `docker run --rm gitrepo:local keygen`}
      GITREPO_ADMIN_TOKEN: ${GITREPO_ADMIN_TOKEN:?set a long random admin token}
      GITREPO_PUBLIC_URL: ${GITREPO_PUBLIC_URL:-http://localhost:8080}
      GITREPO_SSH_LISTEN: ":2222"
      # Optional: mount deploy/gitrepo.example.yaml and point at it.
      # GITREPO_CONFIG: /etc/gitrepo/gitrepo.yaml
    volumes:
      - gitrepo-data:/data
      # - ./gitrepo.example.yaml:/etc/gitrepo/gitrepo.yaml:ro

volumes:
  gitrepo-data:
