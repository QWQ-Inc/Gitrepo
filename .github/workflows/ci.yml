name: ci
on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-go@v6
        with:
          go-version-file: go.mod
      - name: gofmt
        run: test -z "$(gofmt -l .)" || (gofmt -l . && exit 1)
      - run: go vet ./...
      - run: go test -race -count=1 ./...
      - name: cross-compile
        run: |
          for os in linux darwin; do for arch in amd64 arm64; do
            CGO_ENABLED=0 GOOS=$os GOARCH=$arch go build -o /dev/null ./cmd/gitrepo
            CGO_ENABLED=0 GOOS=$os GOARCH=$arch go build -o /dev/null ./cmd/gr
          done; done

  docker:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - name: build image
        run: docker build --build-arg VERSION=ci-${GITHUB_SHA::7} -t gitrepo:ci .
      - name: smoke test
        run: |
          docker run --rm gitrepo:ci version
          docker run --rm --entrypoint git gitrepo:ci --version
          docker run --rm --entrypoint git gitrepo:ci lfs version
          docker run -d --name gitrepo -p 8080:8080 -p 2222:2222 -e GITREPO_SSH_LISTEN=:2222 \
            -e GITREPO_SECRET_KEY="$(docker run --rm gitrepo:ci keygen)" \
            -e GITREPO_ADMIN_TOKEN=ci-admin gitrepo:ci
          for i in $(seq 1 30); do curl -fsS http://127.0.0.1:8080/healthz && break; sleep 1; done
          curl -fsS -H 'Authorization: Bearer ci-admin' http://127.0.0.1:8080/api/status
          curl -fsS -o /dev/null http://127.0.0.1:8080/ui/
          curl -fsS -H 'Authorization: Bearer ci-admin' http://127.0.0.1:8080/api/ssh | grep -q '"enabled": true'
          ssh-keyscan -p 2222 127.0.0.1 | grep -q ssh-ed25519
          for i in $(seq 1 30); do [ "$(docker inspect -f '{{.State.Health.Status}}' gitrepo)" = healthy ] && break; sleep 2; done
          docker inspect -f '{{.State.Health.Status}}' gitrepo | grep -qx healthy
          # push, snapshot the running instance, restore it elsewhere
          git init -q -b main /tmp/w && git -C /tmp/w -c user.name=ci -c user.email=ci@example.com commit -q --allow-empty -m ci
          git -C /tmp/w push -q http://x:ci-admin@127.0.0.1:8080/acme/ci.git main
          docker exec gitrepo gitrepo backup /data/snapshots/ci
          docker exec -e GITREPO_DATA_DIR=/data/restored gitrepo gitrepo restore /data/snapshots/ci
          test "$(docker exec gitrepo git --git-dir=/data/restored/repos/acme/ci.git rev-parse main)" = "$(git -C /tmp/w rev-parse HEAD)"
          docker logs gitrepo
          docker rm -f gitrepo
