# Push a tag like v0.1.0 to publish binaries and a multi-arch image.
name: release
on:
  push:
    tags: ['v*']

permissions:
  contents: write
  packages: write

jobs:
  binaries:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-go@v6
        with:
          go-version-file: go.mod
      - run: go test -count=1 ./...
      - name: build
        run: |
          set -eu
          v="${GITHUB_REF_NAME}"
          mkdir dist
          for os in linux darwin; do for arch in amd64 arm64; do
            d="gitrepo_${v}_${os}_${arch}"
            mkdir "$d"
            for cmd in gitrepo gr; do
              CGO_ENABLED=0 GOOS=$os GOARCH=$arch go build -trimpath -ldflags "-s -w -X main.version=${v}" -o "$d/$cmd" ./cmd/$cmd
            done
            cp LICENSE README.md deploy/gitrepo.example.yaml "$d/"
            tar -czf "dist/$d.tar.gz" "$d"
          done; done
          # The CLI also for Windows (the server needs a Unix system).
          d="gr_${v}_windows_amd64"
          mkdir "$d"
          CGO_ENABLED=0 GOOS=windows GOARCH=amd64 go build -trimpath -ldflags "-s -w -X main.version=${v}" -o "$d/gr.exe" ./cmd/gr
          cp LICENSE README.md "$d/"
          zip -qr "dist/$d.zip" "$d"
          (cd dist && sha256sum *.tar.gz *.zip > SHA256SUMS)
      - name: publish release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -eu
          v="${GITHUB_REF_NAME}"
          # Notes: the CHANGELOG.md section headed "## <tag>", else generated.
          awk -v t="## ${v}" 'index($0, t) == 1 { f = 1; next } /^## / { if (f) exit } f' CHANGELOG.md > notes.md
          if [ -s notes.md ]; then
            gh release create "$v" dist/* --notes-file notes.md --verify-tag
          else
            gh release create "$v" dist/* --generate-notes --verify-tag
          fi

  image:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - name: build and push
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -eu
          image="ghcr.io/$(echo "$GITHUB_REPOSITORY" | tr '[:upper:]' '[:lower:]')"
          echo "$GH_TOKEN" | docker login ghcr.io -u "$GITHUB_ACTOR" --password-stdin
          docker buildx create --use
          docker run --privileged --rm tonistiigi/binfmt --install arm64
          docker buildx build --platform linux/amd64,linux/arm64 \
            --build-arg VERSION="$GITHUB_REF_NAME" \
            --label org.opencontainers.image.source="https://github.com/$GITHUB_REPOSITORY" \
            --label org.opencontainers.image.version="$GITHUB_REF_NAME" \
            -t "$image:$GITHUB_REF_NAME" -t "$image:latest" --push .
